<!doctype html>
<html lang="pt-BR" data-glass-appearance="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquid Glass — tab bar</title>
  <link rel="stylesheet" href="../dist/liquid-glass.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111 url(assets/mist.jpg) center / cover; font-family: var(--lg-font); }
    .app { position: relative; width: 390px; height: min(720px, calc(100svh - 32px)); max-width: 100vw; border-radius: 44px; overflow: hidden; background: #000; }
    .app > .lg-backdrop { position: absolute; inset: 0; overflow: auto; padding: 60px 16px 120px; display: grid; gap: 14px; align-content: start; }
    .app h1 { color: #fff; margin: 0; font-size: 32px; letter-spacing: -0.03em; }
    .tile { height: 180px; border-radius: 22px; }
    .bar { position: absolute; left: 14px; right: 14px; bottom: 20px; display: flex; gap: 10px; }
    .bar .lg-tabs { flex: 1; min-width: 0; }
    .bar .lg-tabs-list { width: 100%; grid-auto-columns: minmax(0, 1fr); }
    .bar .lg-tabs [role=tab] { padding: 0 6px; }
    .orb { width: 62px; height: 62px; flex: none; }
  </style>
</head>
<body>
  <!-- O app é uma .lg-scene: no Safari/Firefox o vidro refrata o feed (.lg-backdrop). -->
  <div class="app lg-scene">
    <div class="lg-backdrop">
      <h1>Início</h1>
      <div class="tile" style="background:linear-gradient(135deg,#ff5f6d,#6a3dff)"></div>
      <div class="tile" style="background:repeating-linear-gradient(45deg,#111 0 14px,#ff3d7f 14px 28px)"></div>
      <div class="tile" style="background:conic-gradient(from 90deg at 70% 40%,#00d4a6,#1fb6ff,#6a3dff,#00d4a6)"></div>
      <div class="tile" style="background:linear-gradient(0deg,#ff9a3c 0 33%,#ff3d7f 33% 66%,#6a3dff 66%)"></div>
    </div>
    <div class="bar">
      <nav class="glass lg-tabs" data-size="large" aria-label="Seções">
        <div class="lg-tabs-list" role="tablist">
          <button role="tab" aria-selected="true">◉<span>Início</span></button>
          <button role="tab">▦<span>Explorar</span></button>
          <button role="tab">≋<span>Rádio</span></button>
          <button role="tab">▤<span>Biblioteca</span></button>
        </div>
      </nav>
      <button class="glass lg-button lg-icon orb" data-glass-interactive aria-label="Buscar">⌕</button>
    </div>
  </div>
  <script src="../dist/liquid-glass.js"></script>
  <script>
    document.querySelector('.lg-tabs').addEventListener('lg:change', function (e) {
      document.querySelector('.app h1').textContent = e.detail.tab.textContent.replace(/^\W+/, '');
    });
  </script>
</body>
</html>
