<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wallpaper generator</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Procedural wallpapers for the examples — 100% original, no stock photos.
// Usage: wallpapers.html#dunes  (rendered + captured by tools/render.mjs)
const W = 2400, H = 1600;
const c = document.getElementById('c');
c.width = W; c.height = H;
const ctx = c.getContext('2d');

// deterministic PRNG + value noise
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const perm = Array.from({ length: 512 }, () => rnd());
const fade = t => t * t * (3 - 2 * t);
function noise1(x) {
  const i = Math.floor(x), f = x - i;
  const a = perm[i & 511], b = perm[(i + 1) & 511];
  return a + (b - a) * fade(f);
}
function fbm(x, oct = 6) {
  let v = 0, amp = 0.5, fr = 1;
  for (let i = 0; i < oct; i++) { v += amp * noise1(x * fr + i * 31.7); amp *= 0.5; fr *= 2.03; }
  return v;
}
function grain(alpha = 10) {
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * alpha;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
}

const scenes = {
  dunes() {
    const sky = ctx.createLinearGradient(0, 0, 0, H * 0.62);
    sky.addColorStop(0, '#0b1426');
    sky.addColorStop(0.45, '#1d2a48');
    sky.addColorStop(0.8, '#4b4a66');
    sky.addColorStop(1, '#8a6c76');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    // stars
    for (let i = 0; i < 900; i++) {
      const x = rnd() * W, y = rnd() * H * 0.5, r = rnd() * 1.4 + 0.2;
      ctx.fillStyle = `rgba(255,255,255,${0.25 + rnd() * 0.65 * (1 - y / (H * 0.5))})`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
    // horizon glow
    const glow = ctx.createRadialGradient(W * 0.62, H * 0.6, 10, W * 0.62, H * 0.6, W * 0.6);
    glow.addColorStop(0, 'rgba(214,150,140,.35)'); glow.addColorStop(1, 'rgba(214,150,140,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    // mountain ridges (far → near)
    const ridges = [
      { base: 0.52, amp: 0.20, f: 0.0019, col: ['#625e74', '#3c3e52'], o: 5 },
      { base: 0.58, amp: 0.20, f: 0.0026, col: ['#43424f', '#26283a'], o: 6 },
      { base: 0.64, amp: 0.15, f: 0.0035, col: ['#2c2b36', '#1a1b25'], o: 6 },
    ];
    ridges.forEach((r, k) => {
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 2) {
        const n = fbm(x * r.f + k * 10, r.o);
        const ridge = Math.pow(1 - Math.abs(n * 2 - 1), 2.2);
        ctx.lineTo(x, H * (r.base - r.amp * (0.4 * n + 0.6 * ridge)));
      }
      ctx.lineTo(W, H); ctx.closePath();
      const g = ctx.createLinearGradient(0, H * (r.base - r.amp), 0, H * (r.base + 0.1));
      g.addColorStop(0, r.col[0]); g.addColorStop(1, r.col[1]);
      ctx.fillStyle = g; ctx.fill();
      // rocky texture
      ctx.save(); ctx.clip();
      for (let i = 0; i < 2600; i++) {
        const x = rnd() * W, y = H * (r.base - r.amp) + rnd() * H * 0.25;
        ctx.fillStyle = `rgba(${rnd() > 0.5 ? '255,255,255' : '0,0,0'},${0.03 + rnd() * 0.05})`;
        ctx.fillRect(x, y, 1 + rnd() * 3, 1 + rnd() * 10);
      }
      ctx.restore();
    });
    // dunes
    const dunes = [
      { y: 0.70, a: 0.06, f: 0.0011, ph: 1.2, c0: '#6c6b74', c1: '#3e3d45' },
      { y: 0.80, a: 0.07, f: 0.0009, ph: 2.7, c0: '#7b7980', c1: '#47464d' },
      { y: 0.92, a: 0.08, f: 0.0007, ph: 4.1, c0: '#8a878e', c1: '#4c4a51' },
    ];
    dunes.forEach(d => {
      const top = x => H * (d.y - d.a * (Math.sin(x * d.f * 6.283 + d.ph) * 0.6 + fbm(x * d.f * 2 + d.ph, 3) * 0.8));
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 4) ctx.lineTo(x, top(x));
      ctx.lineTo(W, H); ctx.closePath();
      const g = ctx.createLinearGradient(0, H * (d.y - d.a), 0, H);
      g.addColorStop(0, d.c0); g.addColorStop(1, d.c1);
      ctx.fillStyle = g; ctx.fill();
      ctx.save(); ctx.clip();
      // wind ripples: thin contour lines following the crest
      for (let k = 0; k < 140; k++) {
        const off = k * 7 + rnd() * 3;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 8) {
          const y = top(x) + off + Math.sin(x * 0.02 + k) * 2.2;
          x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.strokeStyle = `rgba(0,0,0,${0.08 + rnd() * 0.08})`; ctx.lineWidth = 1.4; ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 0.8; ctx.translate(0, 1.5); ctx.stroke(); ctx.translate(0, -1.5);
      }
      // crest light
      ctx.beginPath();
      for (let x = 0; x <= W; x += 4) ctx.lineTo(x, top(x));
      ctx.strokeStyle = 'rgba(255,230,220,.25)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    });
    grain(9);
  },

  aurora() {
    ctx.fillStyle = '#1a0b2e'; ctx.fillRect(0, 0, W, H);
    const blobs = [
      [0.15, 0.2, 0.55, '#ff3d7f'], [0.55, 0.15, 0.5, '#ff9a3c'], [0.9, 0.35, 0.5, '#ffd43c'],
      [0.25, 0.75, 0.6, '#6a3dff'], [0.7, 0.8, 0.55, '#1fb6ff'], [0.5, 0.48, 0.38, '#ff5fd2'],
      [0.05, 0.95, 0.4, '#00d4a6'],
    ];
    ctx.globalCompositeOperation = 'lighter';
    blobs.forEach(([x, y, r, col]) => {
      const g = ctx.createRadialGradient(x * W, y * H, 0, x * W, y * H, r * W);
      g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 0.85; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    });
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    // flowing silk bands
    for (let b = 0; b < 26; b++) {
      ctx.beginPath();
      const y0 = H * (0.1 + b * 0.035), amp = 120 + b * 6, ph = b * 0.37;
      for (let x = -20; x <= W + 20; x += 10) {
        const y = y0 + Math.sin(x * 0.0021 + ph) * amp + Math.sin(x * 0.0007 + ph * 2) * amp * 0.8;
        x > -20 ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.strokeStyle = `rgba(255,255,255,${0.04 + (b % 3) * 0.025})`;
      ctx.lineWidth = 2 + (b % 4) * 3; ctx.stroke();
    }
    grain(12);
  },

  bokeh() {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#05060f'); g.addColorStop(0.6, '#0e1030'); g.addColorStop(1, '#1d0b24');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const palette = ['#ffb347', '#ff6f61', '#ffd166', '#7bdff2', '#b388ff', '#ff8fab', '#f6f7d7'];
    ctx.globalCompositeOperation = 'lighter';
    for (let layer = 0; layer < 3; layer++) {
      const n = [70, 45, 22][layer];
      for (let i = 0; i < n; i++) {
        const x = rnd() * W, y = H * (0.25 + rnd() * 0.7), r = [18, 45, 110][layer] * (0.6 + rnd() * 0.8);
        const col = palette[(rnd() * palette.length) | 0];
        const rg = ctx.createRadialGradient(x, y, r * 0.2, x, y, r);
        rg.addColorStop(0, col + 'aa'); rg.addColorStop(0.75, col + '55'); rg.addColorStop(0.92, col + '88'); rg.addColorStop(1, col + '00');
        ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    grain(8);
  },

  // Light, airy wallpaper for light-appearance demos
  mist() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#dfe9f7'); g.addColorStop(0.5, '#f2e6ef'); g.addColorStop(1, '#fbeee0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const blobs = [[0.2, 0.3, 0.45, '#9ec5ff'], [0.75, 0.25, 0.4, '#ffb3d1'], [0.6, 0.8, 0.5, '#ffd59e'], [0.15, 0.85, 0.35, '#b8f2d8']];
    blobs.forEach(([x, y, r, col]) => {
      const rg = ctx.createRadialGradient(x * W, y * H, 0, x * W, y * H, r * W);
      rg.addColorStop(0, col + 'cc'); rg.addColorStop(1, col + '00');
      ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    });
    // soft rolling hills
    [0.62, 0.72, 0.84].forEach((y0, k) => {
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 4) ctx.lineTo(x, H * y0 - Math.sin(x * 0.0018 + k * 2) * 70 - fbm(x * 0.002 + k * 5, 4) * 120);
      ctx.lineTo(W, H); ctx.closePath();
      ctx.fillStyle = ['rgba(150,170,220,.35)', 'rgba(120,150,210,.4)', 'rgba(90,120,190,.45)'][k]; ctx.fill();
    });
    grain(6);
  },
  // Blue silk wave (Sequoia-like mood, original)
  wave() {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#e9dcb8'); g.addColorStop(0.35, '#9fbfe0'); g.addColorStop(0.6, '#1e5fd6'); g.addColorStop(1, '#062a8a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const band = (y0, a, f, ph, c0, c1, blur) => {
      ctx.save(); ctx.filter = `blur(${blur}px)`;
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 6) ctx.lineTo(x, y0 - x * 0.55 + Math.sin(x * f + ph) * a);
      ctx.lineTo(W, H); ctx.closePath();
      const gg = ctx.createLinearGradient(0, y0 - W * 0.55, W * 0.4, H);
      gg.addColorStop(0, c0); gg.addColorStop(1, c1);
      ctx.fillStyle = gg; ctx.fill(); ctx.restore();
    };
    band(H * 1.25, 160, 0.0016, 0.4, 'rgba(70,150,255,.85)', 'rgba(10,50,190,.95)', 18);
    band(H * 1.55, 120, 0.0022, 2.0, 'rgba(120,200,255,.6)', 'rgba(5,40,160,.9)', 30);
    band(H * 1.85, 90, 0.0019, 3.1, 'rgba(180,220,255,.55)', 'rgba(20,70,200,.8)', 40);
    // crisp highlight edge of the main swoosh
    ctx.beginPath();
    for (let x = 0; x <= W; x += 6) { const y = H * 1.25 - x * 0.55 + Math.sin(x * 0.0016 + 0.4) * 160; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 14; ctx.stroke();
    grain(6);
  },

  // Neutral studio grid (for checking optics, WWDC-like mood)
  grid() {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#e6e7ea'); g.addColorStop(0.55, '#b9bcc4'); g.addColorStop(1, '#3d414b');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(20,22,28,.55)'; ctx.lineWidth = 2;
    for (let x = 150; x < W; x += 300) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 140; y < H; y += 300) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    grain(4);
  },
};

const name = location.hash.slice(1) || 'dunes';
scenes[name]();
document.title = 'done:' + name;
</script>
</body>
</html>
